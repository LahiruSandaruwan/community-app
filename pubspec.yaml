name: educonnect
description: A community chat platform for tutors and students - Educational discussion groups similar to WhatsApp Communities

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core (Required for all Firebase services)
  firebase_core: ^2.24.2

  # Firebase Authentication
  firebase_auth: ^4.15.3

  # Cloud Firestore for real-time database
  cloud_firestore: ^4.13.6

  # Firebase Storage for profile pictures
  firebase_storage: ^11.5.6

  # Firebase Cloud Messaging for push notifications
  firebase_messaging: ^14.7.9

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.6

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # UUID Generator for invite codes
  uuid: ^4.3.3

  # Time formatting
  intl: ^0.18.1

  # Local Storage for offline caching
  shared_preferences: ^2.2.2

  # QR Code generation for invite links
  qr_flutter: ^4.1.0

  # Permission handling
  permission_handler: ^11.2.0

  # URL Launcher for invite links
  url_launcher: ^6.2.4

  # Loading indicators
  flutter_spinkit: ^5.2.0

  # Toast messages
  fluttertoast: ^8.2.4

  # Network connectivity
  connectivity_plus: ^5.0.2

  # Voice & Audio
  record: ^5.0.1
  audioplayers: ^5.2.1
  path_provider: ^2.1.2

  # File handling
  file_picker: ^6.1.1
  open_file: ^3.3.2

  # PDF viewer
  syncfusion_flutter_pdfviewer: ^24.1.41

  # Math equations
  flutter_math_fork: ^0.7.1

  # Code syntax highlighting
  flutter_highlight: ^0.7.0

  # Calendar
  table_calendar: ^3.0.9

  # Charts for analytics
  fl_chart: ^0.66.0

  # Animations
  animations: ^2.0.11

  # Video player (for future)
  video_player: ^2.8.2

  # Language translation
  translator: ^1.0.0

  # Barcode/QR scanner
  mobile_scanner: ^3.5.5

  # Document scanner
  cunning_document_scanner: ^1.2.1

  # HTML rendering (for rich text)
  flutter_html: ^3.0.0-beta.2

  # Markdown support
  flutter_markdown: ^0.6.18

  # Badge notifications
  badges: ^3.1.2

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Pull to refresh
  pull_to_refresh: ^2.0.0

  # Slidable list items
  flutter_slidable: ^3.0.1

  # Rating/Stars
  flutter_rating_bar: ^4.0.1

  # In-app purchases (for premium)
  in_app_purchase: ^3.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts (Optional - using system fonts for now)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
